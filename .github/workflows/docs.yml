name: MonsunLab

on:
  push:
    branches:
      - master
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Zensical
        run: pip install zensical

      - name: Build documentation
        run: zensical build --clean

      - name: Deploy labs.monsun.io redirect to monsun.io/labs
        run: |
          set -euo pipefail
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          # Preserve redirect assets; zensical build leaves a dirty worktree
          mkdir -p /tmp/labs-redirect
          cp redirect/index.html redirect/404.html /tmp/labs-redirect/

          git fetch origin gh-pages || true
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git checkout -f -B gh-pages origin/gh-pages
          else
            git checkout --orphan gh-pages
          fi

          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp /tmp/labs-redirect/index.html index.html
          cp /tmp/labs-redirect/404.html 404.html
          echo "labs.monsun.io" > CNAME

          git add -A
          git diff --cached --quiet || git commit -m "Redirect labs.monsun.io to monsun.io/labs"
          git push origin HEAD:gh-pages --force

      # secrets.* cannot be used in step if: — gate inside the script instead
      - name: Trigger monsun.io/labs deploy
        env:
          GH_TOKEN: ${{ secrets.MONSUNIC_DEPLOY_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Skipping: MONSUNIC_DEPLOY_TOKEN not set"
            exit 0
          fi
          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/monsunic/monsunic.github.io/dispatches \
            -d '{"event_type":"labs-updated"}'
